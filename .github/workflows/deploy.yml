name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testes antes do deploy
        run: ./mvnw -B clean verify

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Fazer deploy na AWS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          script: |
            set -e

            IMAGE="${{ vars.DOCKER_IMAGE }}:${{ github.sha }}"
            CONTAINER="${{ vars.CONTAINER_NAME }}"
            PORT="${{ vars.APP_PORT }}"

            docker pull "$IMAGE"
            docker rm -f "$CONTAINER" 2>/dev/null || true

            docker run -d \
              --restart unless-stopped \
              --name "$CONTAINER" \
              --network rede \
              --env-file /opt/curso-api/app.env \
              -p "$PORT:8080" \
              "$IMAGE"

            for tentativa in $(seq 1 20); do
              if curl --fail --silent http://localhost:"$PORT"/actuator/health; then
                echo
                echo "Deploy concluído"
                exit 0
              fi
              sleep 3
            done

            docker logs "$CONTAINER"
            exit 1